# The rules of R3 in docs/HANDOFF.md: explicit types at every boundary, no dynamic values, and loud failures.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - type_annotate_public_apis
    - unawaited_futures
